<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koiny — Onboarding & Paywall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 15%, rgba(99,102,241,0.2) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 80%, rgba(16,185,129,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .phone {
      width: 390px; height: 844px; border-radius: 50px;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 0 0 10px #1a1f2e,
        0 0 0 11px rgba(255,255,255,0.06),
        0 40px 120px rgba(0,0,0,0.6),
        0 8px 32px rgba(0,0,0,0.4);
      overflow: hidden; flex-shrink: 0;
    }
    .phone::before {
      content: ''; position: absolute; top: 12px;
      left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; border-radius: 20px;
      background: rgba(0,0,0,0.85); z-index: 999;
    }
    .phone::after {
      content: ''; position: absolute; bottom: 8px;
      left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 100px;
      background: rgba(255,255,255,0.25); z-index: 999;
      pointer-events: none;
    }
    #root { width: 100%; height: 100%; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    button { font-family: 'Poppins', sans-serif; cursor: pointer; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-10px) rotate(2deg); }
    }
    @keyframes shimmer {
      from { background-position: -200% 0; }
      to   { background-position: 200% 0; }
    }
    @keyframes pulse {
      0%,100% { opacity: 0.6; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.06); }
    }
    .float-icon { animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="phone">
    <div id="root"></div>
  </div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── Status Bar ─────────────────────────────────────────────────────────────
function StatusBar({ dark = true }) {
  const c = dark ? 'rgba(255,255,255,0.85)' : 'white';
  return (
    <div style={{ height:50, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 28px', paddingTop:14, flexShrink:0, position:'relative', zIndex:20 }}>
      <span style={{ fontFamily:"-apple-system,system-ui", fontSize:16, fontWeight:600, color:c, letterSpacing:-0.3 }}>9:41</span>
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        <svg width="17" height="11" viewBox="0 0 17 11">
          <rect x="0" y="6.5" width="2.8" height="4.5" rx="0.6" fill={c} fillOpacity={0.45}/>
          <rect x="4.2" y="4" width="2.8" height="7" rx="0.6" fill={c} fillOpacity={0.65}/>
          <rect x="8.4" y="1.5" width="2.8" height="9.5" rx="0.6" fill={c}/>
          <rect x="12.6" y="0" width="2.8" height="11" rx="0.6" fill={c}/>
        </svg>
        <svg width="15" height="11" viewBox="0 0 15 11">
          <path d="M7.5 2.8C9.5 2.8 11.3 3.6 12.6 4.9L13.6 3.9C12 2.4 9.9 1.5 7.5 1.5C5.1 1.5 3 2.4 1.4 3.9L2.4 4.9C3.7 3.6 5.5 2.8 7.5 2.8Z" fill={c}/>
          <path d="M7.5 6C8.7 6 9.7 6.5 10.5 7.2L11.5 6.2C10.4 5.2 9 4.5 7.5 4.5C6 4.5 4.6 5.2 3.5 6.2L4.5 7.2C5.3 6.5 6.3 6 7.5 6Z" fill={c}/>
          <circle cx="7.5" cy="9.5" r="1.5" fill={c}/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="18" height="8" rx="2" fill={c}/>
          <path d="M23 4V8C23.8 7.7 24.5 6.8 24.5 6C24.5 5.2 23.8 4.3 23 4Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ── Slide data ─────────────────────────────────────────────────────────────
const SLIDES = [
  {
    emoji: '💰',
    title: "Pocket money\nreinvented",
    desc: "Teach your kids the value of effort and saving, in a fun and secure way.",
    gradientFrom: '#4f46e5', gradientMid: '#6d28d9', gradientTo: '#7c3aed',
    features: [
      { icon: 'fa-shield-halved', text: '100% virtual & secure' },
      { icon: 'fa-children',      text: 'Multi-child support' },
      { icon: 'fa-language',      text: 'FR · NL · EN' },
    ],
  },
  {
    emoji: '🎯',
    title: "Missions\nand rewards",
    desc: "Create daily challenges. Your kids complete them, you approve — they earn virtual coins.",
    gradientFrom: '#7c3aed', gradientMid: '#9333ea', gradientTo: '#c026d3',
    features: [
      { icon: 'fa-broom',       text: 'Clean room → earn 3€' },
      { icon: 'fa-check-double', text: 'One-tap approval' },
      { icon: 'fa-bell',        text: 'Real-time notifications' },
    ],
  },
  {
    emoji: '🏆',
    title: "Goals\nthat motivate",
    desc: "Bike, toy, game… your kids save for their dreams and watch progress grow in real time.",
    gradientFrom: '#059669', gradientMid: '#0891b2', gradientTo: '#0e7490',
    features: [
      { icon: 'fa-chart-line',   text: 'Visual progress bar' },
      { icon: 'fa-gift',         text: 'Motivating savings goals' },
      { icon: 'fa-mobile-screen', text: 'Built-in iOS widget' },
    ],
  },
];

// ── Glass feature pill ─────────────────────────────────────────────────────
function FeaturePill({ icon, text, delay = 0 }) {
  return (
    <div style={{
      display:'flex', alignItems:'center', gap:14,
      background:'rgba(255,255,255,0.09)', backdropFilter:'blur(12px)',
      borderRadius:18, padding:'12px 16px',
      border:'1px solid rgba(255,255,255,0.12)',
      whiteSpace:'nowrap',
    }}>
      <div style={{ width:34, height:34, borderRadius:11, background:'rgba(255,255,255,0.15)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
        <i className={`fa-solid ${icon}`} style={{ fontSize:13, color:'rgba(255,255,255,0.9)' }} />

}

// ═══════════════════════════════════════════════════════════════════════════
// ONBOARDING SCREEN
// ═══════════════════════════════════════════════════════════════════════════
function OnboardingScreen({ onComplete, onSkip }) {
  const [current, setCurrent] = useState(0);
  const [animKey, setAnimKey] = useState(0);
  const touchStartX = useRef(0);
  const touchDeltaX = useRef(0);
  const isLast = current === SLIDES.length - 1;
  const slide = SLIDES[current];

  const goTo = useCallback((idx) => {
    if (idx < 0 || idx >= SLIDES.length) return;
    setCurrent(idx);
    setAnimKey(k => k + 1);
  }, []);

  const next = useCallback(() => {
    if (isLast) onComplete();
    else goTo(current + 1);
  }, [current, isLast, goTo, onComplete]);

  useEffect(() => {
    const h = e => { if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') goTo(current - 1); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [current, next, goTo]);

  const bg = `linear-gradient(160deg, ${slide.gradientFrom} 0%, ${slide.gradientMid} 55%, ${slide.gradientTo} 100%)`;

  return (
    <div
      style={{ width:'100%', height:'100%', background:bg, display:'flex', flexDirection:'column', position:'relative', overflow:'hidden', transition:'background 0.6s ease' }}
      onTouchStart={e => { touchStartX.current = e.touches[0].clientX; }}
      onTouchMove={e => { touchDeltaX.current = e.touches[0].clientX - touchStartX.current; }}
      onTouchEnd={() => { if (Math.abs(touchDeltaX.current) > 50) { touchDeltaX.current < 0 ? next() : goTo(current - 1); } touchDeltaX.current = 0; }}
    >
      {/* Decorative orbs */}
      <div style={{ position:'absolute', top:'-18%', right:'-22%', width:'65%', height:'65%', borderRadius:'50%', background:'rgba(255,255,255,0.05)', filter:'blur(60px)', pointerEvents:'none', animation:'pulse 5s ease-in-out infinite' }} />
      <div style={{ position:'absolute', bottom:'-12%', left:'-18%', width:'55%', height:'55%', borderRadius:'50%', background:'rgba(255,255,255,0.04)', filter:'blur(50px)', pointerEvents:'none', animation:'pulse 7s ease-in-out infinite 2s' }} />

      <StatusBar dark={true} />

      {/* Top bar: language flags + skip */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'2px 20px 0', position:'relative', zIndex:10 }}>
        <div style={{ display:'flex', gap:4 }}>
          {[{flag:'🇫🇷'},{flag:'🇳🇱'},{flag:'🇬🇧'}].map((l, i) => (
            <div key={i} style={{ width:38, height:38, borderRadius:12, background:'rgba(255,255,255,0.12)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, backdropFilter:'blur(8px)', border:'1px solid rgba(255,255,255,0.1)' }}>{l.flag}</div>
          ))}
        </div>
        {!isLast && (
          <button onClick={onSkip} style={{ background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.15)', borderRadius:12, padding:'8px 16px', fontSize:11, fontWeight:800, color:'rgba(255,255,255,0.8)', letterSpacing:'0.1em', textTransform:'uppercase', backdropFilter:'blur(8px)' }}>
            Skip
          </button>
        )}
      </div>

      {/* Main content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'20px 28px 0', position:'relative', zIndex:5 }}>
        {/* Emoji icon */}
        <div key={`icon-${animKey}`} style={{ marginBottom:22 }}>
          <div style={{ width:110, height:110, borderRadius:32, background:'rgba(255,255,255,0.12)', backdropFilter:'blur(16px)', border:'1px solid rgba(255,255,255,0.2)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:56, boxShadow:'0 20px 60px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.25)' }}>
            {slide.emoji}
          </div>
        </div>

        {/* Title */}
        <div key={`title-${animKey}`} style={{ fontSize:32, fontWeight:900, color:'white', textAlign:'center', lineHeight:1.18, marginBottom:12, whiteSpace:'pre-line', letterSpacing:'-0.8px' }}>
          {slide.title}
        </div>

        {/* Desc */}
        <div key={`desc-${animKey}`} style={{ fontSize:13, color:'rgba(255,255,255,0.7)', textAlign:'center', lineHeight:1.65, fontWeight:600, marginBottom:24, maxWidth:300 }}>
          {slide.desc}
        </div>

        {/* Feature pills */}
        <div key={`pills-${animKey}`} style={{ display:'flex', flexDirection:'column', gap:10, width:'100%' }}>
          {slide.features.map((f, i) => (
            <FeaturePill key={f.text} icon={f.icon} text={f.text} delay={0} />
          ))}
        </div>
      </div>

      {/* Bottom: dots + CTA */}
      <div style={{ padding:'24px 28px 40px', position:'relative', zIndex:10 }}>
        {/* Dots */}
        <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:8, marginBottom:20 }}>
          {SLIDES.map((_, i) => (
            <div key={i} onClick={() => goTo(i)} style={{
              height:8, borderRadius:4, cursor:'pointer',
              background: i === current ? 'white' : 'rgba(255,255,255,0.3)',
              width: i === current ? 28 : 8,
              boxShadow: i === current ? '0 0 10px rgba(255,255,255,0.5)' : 'none',
              transition:'all 0.4s cubic-bezier(0.34,1.56,0.64,1)',
            }} />
          ))}
        </div>

        {/* CTA */}
        <button onClick={next} style={{
          width:'100%', height:60, borderRadius:22, border:'none',
          background: isLast ? 'white' : 'rgba(255,255,255,0.18)',
          backdropFilter: isLast ? 'none' : 'blur(12px)',
          border: isLast ? 'none' : '1px solid rgba(255,255,255,0.25)',
          color: isLast ? slide.gradientFrom : 'white',
          fontSize:15, fontWeight:900, letterSpacing:'0.04em',
          display:'flex', alignItems:'center', justifyContent:'center', gap:10,
          boxShadow: isLast ? '0 12px 40px rgba(0,0,0,0.25)' : 'none',
          transition:'all 0.3s',
        }}>
          {isLast ? "Get started free" : "Next"}
          <i className={`fa-solid ${isLast ? 'fa-arrow-right' : 'fa-chevron-right'}`} style={{ fontSize:13 }} />
        </button>

        {isLast && (
          <div style={{ textAlign:'center', marginTop:14, fontSize:10, fontWeight:700, color:'rgba(255,255,255,0.55)', letterSpacing:'0.1em', textTransform:'uppercase' }}>
            Koiny is a simulator · 100% virtual money
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// PAYWALL SCREEN
// ═══════════════════════════════════════════════════════════════════════════
const FEATURES = [
  { icon:'fa-infinity',     color:'#818cf8', bg:'#eef2ff', text:'Unlimited missions per child' },
  { icon:'fa-children',     color:'#10b981', bg:'#ecfdf5', text:'Up to 5 children in your family' },
  { icon:'fa-chart-bar',    color:'#f59e0b', bg:'#fffbeb', text:'Full history & monthly stats' },
  { icon:'fa-rotate',       color:'#6366f1', bg:'#eef2ff', text:'Sync across all your devices' },
];

const PLANS = [
  { id:'monthly', label:'Monthly', price:'2.99€', per:'/month', desc:'Billed monthly, cancel anytime', badge:null, popular:false },
  { id:'yearly',  label:'Yearly',  price:'19.99€', per:'/year', desc:'Only 1.67€/month — best value', badge:'SAVE 44%', popular:true },
];

function PaywallScreen({ onSubscribe, onClose }) {
  const [selected, setSelected] = useState('yearly');
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(false);

  const handleCTA = () => {
    setLoading(true);
    setTimeout(() => { setLoading(false); setSuccess(true); }, 1600);
  };

  if (success) {
    return (
      <div style={{ width:'100%', height:'100%', background:'#0f172a', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:18 }}>
        <div style={{ position:'absolute', top:'20%', left:'50%', transform:'translateX(-50%)', width:'70%', height:'70%', borderRadius:'50%', background:'rgba(99,102,241,0.08)', filter:'blur(80px)', pointerEvents:'none' }} />
        <div style={{ width:88, height:88, borderRadius:28, background:'rgba(52,211,153,0.15)', border:'1px solid rgba(52,211,153,0.3)', display:'flex', alignItems:'center', justifyContent:'center', animation:'popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both', position:'relative', zIndex:1 }}>
          <i className="fa-solid fa-check" style={{ fontSize:36, color:'#34d399' }} />
        </div>
        <div style={{ fontSize:22, fontWeight:800, color:'white', animation:'fadeSlideIn 0.4s ease 0.1s both', position:'relative', zIndex:1 }}>Welcome to Premium!</div>
        <div style={{ fontSize:13, color:'rgba(148,163,184,0.7)', fontWeight:600, animation:'fadeSlideIn 0.4s ease 0.2s both', position:'relative', zIndex:1 }}>Your 7-day free trial has started</div>
      </div>
    );
  }

  return (
    <div style={{ width:'100%', height:'100%', background:'#0f172a', display:'flex', flexDirection:'column', position:'relative', overflow:'hidden' }}>
      {/* Ambient glows */}
      <div style={{ position:'absolute', top:'-10%', left:'-20%', width:'60%', height:'60%', borderRadius:'50%', background:'rgba(99,102,241,0.12)', filter:'blur(80px)', pointerEvents:'none', animation:'pulse 5s ease-in-out infinite' }} />
      <div style={{ position:'absolute', bottom:'-15%', right:'-20%', width:'55%', height:'55%', borderRadius:'50%', background:'rgba(245,158,11,0.08)', filter:'blur(70px)', pointerEvents:'none', animation:'pulse 7s ease-in-out infinite 3s' }} />

      <StatusBar dark={true} />

      {/* Close */}
      <div style={{ padding:'2px 20px 0', position:'relative', zIndex:5 }}>
        <button onClick={onClose} style={{ width:40, height:40, borderRadius:14, background:'rgba(255,255,255,0.08)', border:'0.5px solid rgba(255,255,255,0.12)', backdropFilter:'blur(12px)', display:'flex', alignItems:'center', justifyContent:'center', color:'rgba(255,255,255,0.55)' }}>
          <i className="fa-solid fa-xmark" style={{ fontSize:16 }} />
        </button>
      </div>

      {/* Scrollable content */}
      <div style={{ flex:1, overflowY:'auto', padding:'10px 20px 40px', position:'relative', zIndex:5 }} className="no-scrollbar">

        {/* Hero */}
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'10px 0 22px' }}>
          <div style={{ width:76, height:76, borderRadius:24, background:'rgba(245,158,11,0.18)', border:'1px solid rgba(245,158,11,0.4)', display:'flex', alignItems:'center', justifyContent:'center', marginBottom:16, boxShadow:'0 20px 50px rgba(245,158,11,0.25)' }}>
            <i className="fa-solid fa-crown" style={{ fontSize:32, color:'#fbbf24' }} />
          </div>
          <div style={{ fontSize:22, fontWeight:900, color:'white', letterSpacing:'-0.5px', marginBottom:6, textAlign:'center', whiteSpace:'nowrap' }}>Koiny Premium</div>
          {/* Trial badge */}
          <div style={{ background:'linear-gradient(135deg,rgba(129,140,248,0.2),rgba(99,102,241,0.1))', border:'1px solid rgba(129,140,248,0.3)', borderRadius:100, padding:'7px 16px', display:'flex', alignItems:'center', gap:7, backdropFilter:'blur(8px)', whiteSpace:'nowrap' }}>
            <i className="fa-solid fa-gift" style={{ fontSize:11, color:'#818cf8' }} />
            <span style={{ fontSize:11, fontWeight:800, color:'rgba(165,180,252,0.95)', letterSpacing:'0.03em' }}>7-DAY FREE TRIAL · CANCEL ANYTIME</span>
          </div>
        </div>

        {/* Features card */}
        <div style={{ background:'rgba(255,255,255,0.04)', borderRadius:22, padding:'6px 4px', border:'1px solid rgba(255,255,255,0.08)', marginBottom:18, backdropFilter:'blur(8px)' }}>
          <div style={{ fontSize:10, fontWeight:800, color:'rgba(148,163,184,0.6)', letterSpacing:'0.14em', textTransform:'uppercase', padding:'10px 16px 6px' }}>WHAT YOU UNLOCK</div>
          {FEATURES.map((f, i) => (
            <div key={f.text} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 14px', borderBottom: i < FEATURES.length-1 ? '1px solid rgba(255,255,255,0.05)' : 'none' }}>
              <div style={{ width:36, height:36, borderRadius:11, background:f.bg, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                <i className={`fa-solid ${f.icon}`} style={{ fontSize:14, color:f.color }} />
              </div>
              <span style={{ fontSize:13, fontWeight:600, color:'rgba(226,232,240,0.9)' }}>{f.text}</span>
              <i className="fa-solid fa-check" style={{ fontSize:11, color:'#34d399', marginLeft:'auto', flexShrink:0 }} />
            </div>
          ))}
        </div>

        {/* Plan selector */}
        <div style={{ fontSize:10, fontWeight:800, color:'rgba(148,163,184,0.6)', letterSpacing:'0.14em', textTransform:'uppercase', marginBottom:10 }}>CHOOSE YOUR PLAN</div>
        <div style={{ display:'flex', flexDirection:'column', gap:10, marginBottom:20 }}>
          {PLANS.map(plan => {
            const isSelected = selected === plan.id;
            return (
              <div key={plan.id} onClick={() => setSelected(plan.id)} style={{
                borderRadius:20, padding:'16px 18px', cursor:'pointer',
                background: isSelected ? 'rgba(99,102,241,0.15)' : 'rgba(255,255,255,0.04)',
                border: `2px solid ${isSelected ? 'rgba(129,140,248,0.7)' : 'rgba(255,255,255,0.08)'}`,
                backdropFilter:'blur(8px)', transition:'all 0.2s', position:'relative', overflow:'hidden',
              }}>
                {plan.popular && (
                  <div style={{ position:'absolute', top:0, right:0, background:'linear-gradient(135deg,#818cf8,#4338ca)', padding:'4px 14px', borderRadius:'0 18px 0 12px', fontSize:9, fontWeight:900, color:'white', letterSpacing:'0.1em' }}>BEST VALUE</div>
                )}
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                    <div style={{ width:22, height:22, borderRadius:'50%', border:`2px solid ${isSelected ? '#818cf8' : 'rgba(255,255,255,0.2)'}`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                      {isSelected && <div style={{ width:10, height:10, borderRadius:'50%', background:'#818cf8' }} />}
                    </div>
                    <div>
                      <div style={{ fontSize:15, fontWeight:800, color: isSelected ? 'rgba(199,210,254,0.95)' : 'rgba(226,232,240,0.8)' }}>{plan.label}</div>
                      <div style={{ fontSize:11, color:'rgba(148,163,184,0.7)', fontWeight:600, marginTop:1 }}>{plan.desc}</div>
                    </div>
                  </div>
                  <div style={{ textAlign:'right' }}>
                    <div style={{ fontSize:18, fontWeight:900, color: isSelected ? '#818cf8' : 'rgba(226,232,240,0.7)', letterSpacing:'-0.4px' }}>{plan.price}</div>
                    <div style={{ fontSize:10, color:'rgba(148,163,184,0.5)', fontWeight:700 }}>{plan.per}</div>
                  </div>
                </div>
                {plan.badge && (
                  <div style={{ display:'inline-block', marginTop:4, marginLeft:32, background:'rgba(52,211,153,0.15)', border:'1px solid rgba(52,211,153,0.3)', borderRadius:100, padding:'3px 10px', fontSize:9, fontWeight:900, color:'#34d399', letterSpacing:'0.1em', whiteSpace:'nowrap' }}>
                    {plan.badge}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* CTA */}
        <button onClick={handleCTA} style={{
          width:'100%', height:58, borderRadius:20, border:'none', marginBottom:14,
          background: loading ? 'rgba(129,140,248,0.5)' : 'linear-gradient(135deg,#818cf8,#4338ca)',
          color:'white', fontSize:15, fontWeight:900, letterSpacing:'0.04em',
          boxShadow: loading ? 'none' : '0 12px 36px rgba(79,70,229,0.45)',
          display:'flex', alignItems:'center', justifyContent:'center', gap:10,
          transition:'all 0.2s',
        }}>
          {loading ? (
            <><i className="fa-solid fa-spinner fa-spin" style={{ fontSize:16 }} /> Processing…</>
          ) : (
            <><i className="fa-solid fa-rocket" style={{ fontSize:14 }} /> Start free trial</>
          )}
        </button>

        {/* Restore */}
        <div style={{ textAlign:'center', marginBottom:16 }}>
          <button onClick={onClose} style={{ background:'none', border:'none', fontSize:12, fontWeight:700, color:'rgba(99,102,241,0.7)', padding:'4px 0' }}>
            Restore purchases
          </button>
        </div>

        {/* Legal footer */}
        <div style={{ background:'rgba(255,255,255,0.03)', borderRadius:16, padding:'12px 14px', border:'1px solid rgba(255,255,255,0.05)' }}>
          <div style={{ fontSize:10, color:'rgba(100,116,139,0.8)', fontWeight:500, textAlign:'center', lineHeight:1.7 }}>
            Free trial starts today. After 7 days, subscription auto-renews. Cancel anytime in App Store settings.
          </div>
          <div style={{ display:'flex', justifyContent:'center', gap:12, marginTop:8 }}>
            <span style={{ fontSize:10, color:'rgba(99,102,241,0.6)', fontWeight:700 }}>Terms of Use</span>
            <span style={{ fontSize:10, color:'rgba(100,116,139,0.4)' }}>·</span>
            <span style={{ fontSize:10, color:'rgba(99,102,241,0.6)', fontWeight:700 }}>Privacy Policy</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// Screen switcher (prototype nav)
// ═══════════════════════════════════════════════════════════════════════════
function ScreenSwitcher({ current, onChange }) {
  const screens = [
    { id:'onboarding', label:'Onboarding' },
    { id:'paywall', label:'Paywall' },
  ];
  return (
    <div style={{ position:'absolute', bottom:-52, left:'50%', transform:'translateX(-50%)', display:'flex', gap:8, zIndex:10 }}>
      {screens.map(s => (
        <button key={s.id} onClick={() => onChange(s.id)} style={{
          padding:'7px 18px', borderRadius:100, border:'none', cursor:'pointer',
          background: current === s.id ? 'rgba(129,140,248,0.9)' : 'rgba(255,255,255,0.1)',
          color: current === s.id ? 'white' : 'rgba(255,255,255,0.45)',
          fontSize:11, fontWeight:700, letterSpacing:'0.06em', backdropFilter:'blur(8px)',
          transition:'all 0.2s',
        }}>{s.label}</button>
      ))}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// App root
// ═══════════════════════════════════════════════════════════════════════════
function App() {
  const [screen, setScreen] = useState('onboarding');
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => {
    const h = e => {
      if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  const saved = localStorage.getItem('koiny_onboarding_screen');
  useEffect(() => { if (saved) setScreen(saved); }, []);
  useEffect(() => { localStorage.setItem('koiny_onboarding_screen', screen); }, [screen]);

  return (
    <div style={{ position:'relative' }}>
      <div style={{ width:390, height:844, position:'relative', overflow:'hidden', borderRadius:50 }}>
        {screen === 'onboarding' && (
          <OnboardingScreen
            onComplete={() => setScreen('paywall')}
            onSkip={() => setScreen('paywall')}
          />
        )}
        {screen === 'paywall' && (
          <PaywallScreen
            onSubscribe={() => {}}
            onClose={() => setScreen('onboarding')}
          />
        )}
      </div>
      <ScreenSwitcher current={screen} onChange={setScreen} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode, null, React.createElement(App))
);
</script>
</body>
</html>
